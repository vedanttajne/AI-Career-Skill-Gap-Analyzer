<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Career</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            color: white;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #a78bfa;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: rgba(15, 23, 42, 0.7);
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #8b5cf6;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            min-height: 20px;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #cbd5e1;
        }

        .register-link a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            AI<span>Career</span>
        </div>

        <h1>Welcome Back 👋</h1>

        <p class="subtitle">
            Login to continue your career analysis
        </p>

        <form id="loginForm">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div id="message"></div>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

    <script>

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            message.textContent = "Logging in...";

            try {

                const response = await fetch("http://127.0.0.1:8000/login", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {

                    message.textContent = "Login successful!";

                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);

                } else {

                    message.textContent =
                        data.detail || "Login failed.";

                }

            } catch (error) {

                message.textContent =
                    "Cannot connect to the server.";

                console.error(error);
            }

        });

    </script>

</body>
</html>
